server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed Next.js assets never change – let browsers and Cloudflare keep them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML / RSC payloads change on every deploy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
}
